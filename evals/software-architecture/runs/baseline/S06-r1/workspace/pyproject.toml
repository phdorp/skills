[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "birdlog"
version = "0.1.0"
description = "Command-line bird sighting log with eBird CSV export"
requires-python = ">=3.11"
# Runtime has no third-party dependencies by design: stdlib only.
dependencies = []

[project.scripts]
birdlog = "birdlog.cli:main"

[tool.setuptools.packages.find]
include = ["birdlog*"]
