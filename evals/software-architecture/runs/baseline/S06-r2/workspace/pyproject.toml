[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "birdlog"
version = "0.1.0"
description = "Log bird sightings from the command line; export to eBird CSV."
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.scripts]
birdlog = "birdlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
